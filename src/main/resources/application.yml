server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: workout-tracker-backend

  # Database Configuration - H2 for development
  datasource:
    url: jdbc:h2:mem:workout_tracker;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # Schema is managed by Flyway (src/main/resources/db/migration);
  # Hibernate only checks that the entities match it.
  flyway:
    enabled: true
    locations: classpath:db/migration

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # H2 Console (development only)
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
        trace: false

# JWT Configuration
# JWT_SECRET is required: a Base64-encoded key of at least 256 bits,
# e.g. generated with `openssl rand -base64 64`
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds

# Optional initial admin account, created on startup if it does not exist yet
app:
  admin:
    username: ${ADMIN_USERNAME:}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Logging
logging:
  level:
    com.workouttracker: DEBUG
    org.springframework.security: DEBUG

---
# Production Profile
spring:
  config:
    activate:
      on-profile: production

  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    show-sql: false

  h2:
    console:
      enabled: false

logging:
  level:
    com.workouttracker: INFO
    org.springframework.security: WARN
